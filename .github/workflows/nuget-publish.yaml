name: AgentMesh Publish NuGet Package

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '!src/AgentMeshCLI/**'
      - '!src/AgentMeshWeb/**'
      - '!src/CallbackViewer/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, Test, Pack and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate package version
        id: version
        shell: bash
        run: |
          VERSION="2.2.$(date -u +'%Y%m%d.%H%M%S')-ci.${GITHUB_SHA::12}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Restore Runtime project
        run: dotnet restore src/AgentMesh.Runtime/AgentMesh.Runtime.csproj

      - name: Build Runtime project
        run: >
          dotnet build src/AgentMesh.Runtime/AgentMesh.Runtime.csproj
          --configuration Release
          --no-restore

      - name: Test Runtime project
        run: >
          dotnet test tests/AgentMesh.Runtime.Tests/AgentMesh.Runtime.Tests.csproj
          --configuration Release

      - name: Pack Runtime NuGet package
        run: >
          dotnet pack src/AgentMesh.Runtime/AgentMesh.Runtime.csproj
          --configuration Release
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
